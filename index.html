<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portal oficial docente para gestión digital de licencias médicas (ABC) y recibos de sueldo. Colegio San Jorge." />
    <title>Colegio San Jorge | Mis Licencias & Recibos Digitales</title>

    <!-- Open Graph / WhatsApp Preview Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Colegio San Jorge | Mis Licencias & Recibos Digitales" />
    <meta property="og:description" content="Portal oficial docente para gestión digital de licencias médicas (ABC) y recibos de sueldo. Colegio San Jorge." />
    <meta property="og:image" content="/logo.png" />

    <script>
      (function() {
        const removeNetlifyElements = () => {
          const selectors = [
            'netlify-drawer',
            'netlify-badge',
            '#netlify-drawer-root',
            '#netlify-drawer',
            '#netlify-badge-root',
            '#netlify-badge',
            '[data-netlify-badge]',
            '[data-netlify-drawer]',
            'iframe[src*="netlify"]',
            'a[href*="netlify.com"]',
            '[class*="netlify-drawer"]',
            '[class*="netlify-badge"]'
          ];
          selectors.forEach(selector => {
            document.querySelectorAll(selector).forEach(el => el.remove());
          });
          document.querySelectorAll('div, button, a, span').forEach(el => {
            if (el.children.length === 0 && el.textContent && el.textContent.toLowerCase().includes('powered by netlify')) {
              const parentBox = el.closest('div, a, button');
              if (parentBox) parentBox.remove();
            }
          });
        };
        window.addEventListener('DOMContentLoaded', removeNetlifyElements);
        window.addEventListener('load', removeNetlifyElements);
        setInterval(removeNetlifyElements, 300);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
